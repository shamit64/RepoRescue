[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporescue"
version = "0.1.0"
description = "Local-first repository health analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Shamit Reddy" }]
keywords = [
    "repository", "health", "audit", "code-quality", "git", "cli", "ci", "offline", "report",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/shamit64/RepoRescue"
Source = "https://github.com/shamit64/RepoRescue"
Issues = "https://github.com/shamit64/RepoRescue/issues"
Changelog = "https://github.com/shamit64/RepoRescue/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "twine>=5"]

[project.scripts]
reporescue = "reporescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
